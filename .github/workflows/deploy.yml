name: Deploy

on:
  push:
    branches: [main]
    # 이 레포는 매일 스크래퍼 봇이 scrape/briefing 커밋을 main에 직접 여러 번 찍는다
    # (data/, docs/ 등) — 그것과 무관하게 매번 재배포되는 걸 막기 위해 앱 코드
    # 경로로만 트리거를 좁힌다.
    paths:
      - "backend/**"
      - "css/**"
      - "js/**"
      - "index.html"
      - "gallery.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nara-app-wine-scrapper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
          cd /opt/nara-app-wine-scrapper
          git fetch origin main
          git reset --hard origin/main

      - name: Sync backend to production path and restart
        # 실제 운영 경로는 docker가 아니라 NID 허브 블록 a5("와인정보 스크래퍼")가
        # 물고 있는 systemd 서비스(wine-scraper-api.service, 포트 8001,
        # /var/www/NID/wine-scraper-api/) — git 없이 파일을 직접 배포하던 곳이다
        # (2026-09-04 확인: 별도로 만들었던 docker-compose 배포는 허브에 안 물려있어
        # 아무도 안 보고 있었다). .env는 그 디렉토리에 이미 있는 걸 그대로 쓴다.
        run: |
          rsync -a --delete /opt/nara-app-wine-scrapper/backend/app/ /var/www/NID/wine-scraper-api/app/
          cp /opt/nara-app-wine-scrapper/backend/requirements.txt /var/www/NID/wine-scraper-api/requirements.txt
          /var/www/NID/wine-scraper-api/.venv/bin/pip install -q -r /var/www/NID/wine-scraper-api/requirements.txt
          grep -q '^IMAGE_PRICE_EXTRACTOR=' /var/www/NID/wine-scraper-api/.env || \
            echo 'IMAGE_PRICE_EXTRACTOR=gemini' >> /var/www/NID/wine-scraper-api/.env
          systemctl restart wine-scraper-api

      - name: Sync frontend to production path
        # docs/(briefings·data·summaries — 스크래퍼가 쌓는 산출물)는 건드리지 않는다.
        run: |
          cp /opt/nara-app-wine-scrapper/index.html /opt/nara-app-wine-scrapper/gallery.html /var/www/NID/wine-scraper/
          rsync -a --delete /opt/nara-app-wine-scrapper/css/ /var/www/NID/wine-scraper/css/
          rsync -a --delete /opt/nara-app-wine-scrapper/js/ /var/www/NID/wine-scraper/js/

      - name: Verify health endpoint
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:8001/health > /dev/null; then
              echo "backend healthy"
              exit 0
            fi
            echo "backend not ready yet, retrying ($i/12)..."
            sleep 5
          done
          echo "backend did not become healthy in time"
          exit 1
