name: Deploy

on:
  push:
    branches: [main]
    # 이 레포는 매일 스크래퍼 봇이 scrape/briefing 커밋을 main에 직접 여러 번 찍는다
    # (data/, docs/ 등) — 그것과 무관하게 매번 재배포되는 걸 막기 위해 앱 코드
    # 경로로만 트리거를 좁힌다.
    paths:
      - "backend/**"
      - "css/**"
      - "js/**"
      - "index.html"
      - "gallery.html"
      - "Dockerfile.frontend"
      - "nginx.conf"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nara-app-wine-scrapper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest and rebuild containers
        run: |
          cd /opt/nara-app-wine-scrapper
          git fetch origin main
          git reset --hard origin/main
          docker compose down --remove-orphans
          docker compose up -d --build

      - name: Verify health endpoints
        run: |
          check() {
            local name="$1" url="$2"
            for i in $(seq 1 12); do
              if curl -sf "$url" > /dev/null; then
                echo "$name healthy"
                return 0
              fi
              echo "$name not ready yet, retrying ($i/12)..."
              sleep 5
            done
            echo "$name did not become healthy in time"
            return 1
          }
          check backend http://localhost:8016/health
          check frontend http://localhost:3016/
